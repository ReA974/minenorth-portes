plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'fr.minenorth'
version = '1.0.0'
base { archivesName = 'minenorth-portes' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { minenorthportes { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories {
    flatDir { dirs '../minenorth-api/build/libs' }   // MineNorth API (builder minenorth-api d'abord)
    flatDir { dirs 'libs' }   // MRPhone 2 : copie de « MRPhone 2 0.9.4 beta.jar » renommée mrphone-0.9.4.jar (non redistribuée)
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.10'
    implementation fg.deobf("blank:minenorth_api:1.0.0")
    // Application « Mon gang » dans le téléphone : seulement pour compiler client/phone (chargé seulement si le téléphone est là)
    compileOnly fg.deobf("blank:mrphone:0.9.4")
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}
test { useJUnitPlatform() }
jar {
    manifest { attributes([
        'Specification-Title': 'MineNorth Portes',
        'Specification-Vendor': 'MineNorth RP',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'MineNorth RP'
    ]) }
}
jar.finalizedBy('reobfJar')
